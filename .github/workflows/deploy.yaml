name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ceiromaniamappathfinder/ai-pathfinder-api

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test before shipping
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Secret DOKPLOY_DEPLOY_WEBHOOK is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK" > /dev/null
          echo "Deploy triggered."

      - name: Wait for this commit to go live
        env:
          HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Repo variable PUBLIC_HEALTH_URL is not set (e.g. https://your-domain/api/health)."
            exit 1
          fi
          for i in $(seq 1 60); do
            live=$(curl -sf --max-time 5 "$HEALTH_URL" \
              | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ "$live" = "$EXPECTED" ]; then
              echo "Live on $EXPECTED after $((i * 5))s."
              exit 0
            fi
            echo "attempt $i/60 — live=${live:-<no response>}"
            sleep 5
          done
          echo "::error::$EXPECTED did not go live within 300s. Last seen: ${live:-<no response>}"
          exit 1

      - name: Rollback hint
        if: failure()
        run: |
          echo "Deploy failed. To roll back, point the Dokploy app at a previous tag:"
          echo "  ${{ env.IMAGE }}:sha-<previous-commit-sha>"
          echo "then redeploy from the Dokploy UI."
